<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LHGCGQ23CV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>תודה על ההזמנה — איילת ספירשטיין</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#261c63">
  <link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="../../assets/favicon.png" type="image/png" sizes="64x64">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../shop.css">
  <style>
    .thanks { max-width: 36rem; padding-block: clamp(3rem, 10vw, 6rem); text-align: center; }
    .thanks-card { background: var(--lav); color: var(--lav-ink); padding: clamp(2rem, 6vw, 3rem) 1.5rem; display: grid; gap: 1rem; justify-items: center; }
    .thanks h1 { font-size: clamp(1.6rem, 4.5vw, 2rem); }
    .thanks h1 + p { margin-top: -.4rem; font-size: 1.125rem; line-height: 1.6; }
    .thanks .meta { font-size: .95rem; opacity: .8; }
    .thanks .actions { justify-content: center; margin-top: .5rem; }
    .thanks .btn { border-color: var(--lav-ink); color: var(--lav-ink); }
    .thanks .btn-primary { background: var(--lav-ink); color: #fff; }

    /* Paid: a one-time burst of pixel hearts floats up the screen, like winning a life */
    .hearts { position: fixed; inset: 0; z-index: 200; overflow: hidden; pointer-events: none; }
    .hearts span { position: absolute; bottom: 0; }
    .hearts svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; }
    .heart-still { width: 39px; height: 33px; }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">איילת ספירשטיין</a>
      <nav class="nav" aria-label="ניווט ראשי">
        <a href="/" aria-current="page">חנות</a>
        <a href="/zarot-chapter-1/" class="nav-chapter"><span class="nav-long">לקריאת </span>פרק ראשון</a>
        <a href="/portfolio/#works">תיק עבודות</a>
        <a href="/organizations/" class="nav-org">רכישה לארגונים<span class="nav-long"> וחברות</span></a>
        <a class="cart-btn" href="/#cart" aria-label="עגלת קניות">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 8H6.2"/><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
          <span class="cart-count" hidden>0</span>
        </a>
      </nav>
    </div>
  </header>

  <main class="container thanks">
    <div class="thanks-card" aria-live="polite">
      <h1 id="title">בודקים את התשלום…</h1>
      <p id="text">רק רגע.</p>
      <p id="meta" class="meta" hidden></p>
      <div class="actions">
        <a class="btn btn-primary" href="/">חזרה לחנות</a>
        <a class="btn btn-ghost" href="mailto:ayelet126@gmail.com">יצירת קשר</a>
      </div>
    </div>
  </main>

  <script src="../config.js"></script>
  <script>
    (function () {
      var CHECKOUT_API = (window.SHOP_CHECKOUT_API || '').replace(/\/+$/, '');
      var params = new URLSearchParams(location.search);
      var id = params.get('OG-PaymentID') || params.get('og-paymentid');
      var title = document.getElementById('title');
      var text = document.getElementById('text');
      var meta = document.getElementById('meta');

      // Pixel heart drawn on a 13×11 grid: M body, D shade, W shine
      var HEART = [
        '..MMM...MMM..',
        '.MWWMM.MMMMM.',
        'MWWMMMMMMMMMD',
        'MWMMMMMMMMMMD',
        'MMMMMMMMMMMMD',
        '.MMMMMMMMMMD.',
        '..MMMMMMMMD..',
        '...MMMMMMD...',
        '....MMMMD....',
        '.....MMD.....',
        '......D......'
      ];
      var HEART_COLORS = [
        { M: '#da2e70', D: '#a51a55', W: '#ffd3e6' },   // magenta
        { M: '#f39cc6', D: '#d670a3', W: '#ffffff' }    // baby pink
      ];
      function heartSvg(c) {
        var r = '';
        HEART.forEach(function (row, y) {
          for (var x = 0; x < row.length; x++) {
            if (row[x] !== '.') r += '<rect x="' + x + '" y="' + y + '" width="1" height="1" fill="' + c[row[x]] + '"/>';
          }
        });
        return '<svg viewBox="0 0 13 11" aria-hidden="true">' + r + '</svg>';
      }
      function celebrate() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          var still = document.createElement('span');
          still.className = 'heart-still';
          still.innerHTML = heartSvg(HEART_COLORS[0]);
          title.parentNode.insertBefore(still, title);
          return;
        }
        var box = document.createElement('div');
        box.className = 'hearts';
        box.setAttribute('aria-hidden', 'true');
        var n = window.innerWidth < 600 ? 9 : 12, last = 0;
        for (var i = 0; i < n; i++) {
          var k = [2, 3, 3, 4][Math.floor(Math.random() * 4)];   // size in whole pixels, so the edges stay sharp
          var h = document.createElement('span');
          h.style.width = 13 * k + 'px';
          h.style.height = 11 * k + 'px';
          // spread across the width: one heart per slice, at a random spot in it
          h.style.left = ((i + .15 + Math.random() * .7) / n * 100) + '%';
          h.innerHTML = heartSvg(HEART_COLORS[i % 2]);
          box.appendChild(h);
          var rise = window.innerHeight * (.55 + Math.random() * .4);
          var sway = (Math.random() < .5 ? -1 : 1) * (10 + Math.random() * 14);
          var time = 2200 + Math.random() * 1000, delay = Math.random() * 700;
          last = Math.max(last, time + delay);
          h.animate([
            { transform: 'translate(-50%, 100%)', opacity: 1 },
            { transform: 'translate(calc(-50% + ' + sway + 'px), ' + (-rise * .35) + 'px)', opacity: 1, offset: .3 },
            { transform: 'translate(calc(-50% - ' + sway + 'px), ' + (-rise * .7) + 'px)', opacity: 1, offset: .65 },
            { transform: 'translate(-50%, ' + (-rise) + 'px)', opacity: 0 }
          ], { duration: time, delay: delay, easing: 'ease-out', fill: 'both' });
        }
        document.body.appendChild(box);
        setTimeout(function () { box.remove(); }, last + 100);
      }

      function paid(amount, paymentId) {
        try { localStorage.removeItem('shop-cart'); } catch (e) {}
        var badge = document.querySelector('.cart-count');
        if (badge) badge.hidden = true;
        title.textContent = 'תודה! התשלום התקבל';
        text.textContent = 'החשבונית נשלחה לאימייל שלך. אצור איתך קשר לגבי המשלוח.';
        celebrate();
        if (amount != null) { meta.textContent = 'סכום: ' + amount + ' ש״ח · מספר תשלום: ' + paymentId; meta.hidden = false; }
      }
      function unknown() {
        title.textContent = 'לא הצלחנו לאמת את התשלום';
        text.textContent = 'אם חויבת, אין מה לדאוג: החשבונית תגיע לאימייל. אפשר גם לפנות אליי ונבדוק את ההזמנה.';
      }

      if (!id || !CHECKOUT_API) return unknown();
      fetch(CHECKOUT_API + '/verify?id=' + encodeURIComponent(id))
        .then(function (r) { return r.json(); })
        .then(function (res) { if (res && res.valid) paid(res.amount, res.id); else unknown(); })
        .catch(unknown);
    })();
  </script>
  <script src="/shop/cart-badge.js"></script>
</body>
</html>
